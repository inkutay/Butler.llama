const pendingCardSaves = new Map();
const cardNumberDefaults = {ngl:99, ctx:16384, parallel:1, mtp_nmax:0, moe_cache_mib:0};

function saveParams(id, control){
    const field = control.dataset.param;
    const checkbox = control.type === 'checkbox';
    const readValue = element => checkbox ? element.checked : element.value;
    const input = readValue(control);
    const previous = pendingCardSaves.get(id) || Promise.resolve();
    const save = previous.then(async () => {
        const instance = INSTANCES.find(item => item.id === id);
        let value = input;
        try {
            if (Object.hasOwn(cardNumberDefaults, field)) {
                const minimum = field === 'parallel' ? 1 : 0;
                if (!/^[0-9]+$/.test(input.trim()) || !Number.isSafeInteger(Number(input)) || Number(input) < minimum) {
                    throw new Error(field.toUpperCase() + ': enter an integer ≥ ' + minimum);
                }
                value = Number(input);
            } else if (field === 'kvq') {
                value = input.toLowerCase();
            }
            const result = await apiPost('/api/instances/' + encodeURIComponent(id) + '/params', {[field]:value});
            if (result.success !== true) throw new Error(result.message || 'save failed');
            const latest = INSTANCES.find(item => item.id === id);
            if (latest) latest[field] = value;
        } catch (error) {
            toast(error.message || 'save failed', true);
            if (control.isConnected && readValue(control) === input) {
                const confirmed = INSTANCES.find(item => item.id === id) || instance;
                const saved = confirmed?.[field] ?? cardNumberDefaults[field] ?? (checkbox ? false : '');
                if (checkbox) control.checked = saved;
                else control.value = field === 'kvq' ? String(saved || 'q8_0').toUpperCase() : saved;
            }
        }
        if (!control.isConnected) return;
        const card = control.closest('.instance-card');
        const ctx = Number(card.querySelector('.inst-ctx')?.value ?? 16384);
        const parallel = Number(card.querySelector('.inst-parallel')?.value ?? 1);
        const header = card.querySelector('.inst-ctx-val');
        if (header) header.textContent = Math.round(ctx / Math.max(1, parallel));
        if (field === 'model' && !control.value) {
            document.getElementById('stats_' + id)?.replaceChildren();
        }
        recalcCard(card);
    });
    pendingCardSaves.set(id, save);
    const clear = () => { if (pendingCardSaves.get(id) === save) pendingCardSaves.delete(id); };
    save.then(clear, clear);
    return save;
}

// ---- Instance state machine: off | loading | on | stopping | failed ----
// "container in docker ps" (ACTIVE) != "model ready" (model_ready). Direction (up/down)
// comes from user intent + transitions; FAILED = container appeared then died during a load (OOM etc.).
const _is={};   // id -> {intent:'up'|'down'|null, pending, sawRunning, failed, prevReady}
const _state={}; // id -> state string
const pendingStops=new Map();
const STATE_UI={off:{lbl:'OFF',bg:'#647864',cls:''},loading:{lbl:'LOAD',bg:'#C8C864',cls:'tgl-loading'},on:{lbl:'ON',bg:'#009600',cls:''},stopping:{lbl:'STOP',bg:'#C8C864',cls:'tgl-stopping'},failed:{lbl:'FAIL',bg:'#FF0000',cls:'tgl-failed'}};
function advanceState(id,act,ready,failed,beStop){
  // failed = backend ground truth (model_failed: container exited with non-zero code = crash).
  // st.failed is STICKY: once a crash is known (by us or the backend) it stays red until a
  // successful load or a clean stop. A new attempt (retry) ignores the stale corpse.
  let st=_is[id]||(_is[id]={intent:null,pending:false,sawRunning:false,failed:false,prevReady:false});
  if(beStop||pendingStops.has(id)){st.sawRunning=true;_state[id]='stopping';return _state[id];}
  const attempting=st.intent==='up'&&st.pending;
  if(st.intent==='down'){
    if(act){
      st.sawRunning=true;
      _state[id]='stopping';
      return _state[id];
    }
    st.pending=false;st.sawRunning=false;st.prevReady=false;st.intent=null;
  }
  if(failed&&!attempting) st.failed=true;
  if(ready){st.pending=false;st.sawRunning=false;st.prevReady=true;st.intent=null;st.failed=false;_state[id]='on';}
  else if(st.failed){_state[id]='failed';}
  else if(act){st.sawRunning=true;
    _state[id]=st.prevReady?'stopping':'loading';}
  else{
    _state[id]=attempting?'loading':'off';
    if(!attempting){st.pending=false;st.sawRunning=false;st.prevReady=false;st.intent=null;}}
  return _state[id];
}
function setInstIntent(id,dir){
  let st=_is[id]||(_is[id]={intent:null,pending:false,sawRunning:false,failed:false,prevReady:false});
  if(dir==='up'){st.intent='up';st.pending=true;st.sawRunning=false;st.failed=false;st.prevReady=false;_state[id]='loading';}
  else{st.intent='down';st.pending=false;_state[id]='stopping';}
}
function instTitle(s){return s==='on'?'Model loaded':(s==='loading'?ButlerI18n.translate('Loading... click to stop'):(s==='stopping'?'Stopping...':(s==='failed'?ButlerI18n.translate('Failed to load (OOM?) - reduce CTX/NGL, click to retry'):'Stopped')));}

async function deleteInst(id){
const inst=INSTANCES.find(x=>x.id===id);
const nm=(inst&&inst.name)||id;
if(!(await dlgConfirm({title:'DELETE INSTANCE',text:'Delete "'+nm+'" ?',ok:'DELETE',danger:true})))return;
try{const r=await apiDelete('/api/instances/'+id);toast(r.message||'Deleted');_mutate=true;await loadStatus();}catch(e){toast(e.message,true);}}
async function moveInst(id,direction){try{const r=await apiPost('/api/instances/'+id+'/move',{direction});if(r&&r.success===false){toast(r.message||'Move failed',true);return;}_mutate=true;await loadStatus();}catch(e){toast(e.message,true);}}

function toggleChatCard(){const c=document.getElementById('chatCard');if(c)c.classList.toggle('expanded');}
function scrollCardTop(card,offset=20){const y=card.getBoundingClientRect().top+window.scrollY-offset;window.scrollTo({top:Math.max(0,y),behavior:'smooth'});}
function toggleInstCard(id){const card=document.querySelector(`.instance-card[data-inst="${id}"]`);if(!card)return;const willExpand=!card.classList.contains('expanded');document.querySelectorAll('.instance-card').forEach(c=>{if(c!==card)c.classList.remove('expanded');});card.classList.toggle('expanded');_expandedId=willExpand?id:'';if(willExpand)requestAnimationFrame(()=>scrollCardTop(card));}

function requestInstanceStop(id){
    if(pendingStops.has(id))return pendingStops.get(id);
    setInstIntent(id,'down');
    const request=apiPost('/api/unload',{instance:id}).catch(error=>{
        _is[id].intent=null;
        throw error;
    }).finally(()=>{
        pendingStops.delete(id);
        updateMetrics(_lastMetrics||{});
    });
    pendingStops.set(id,request);
    updateMetrics(_lastMetrics||{});
    return request;
}

async function instStartStop(id){
const inst=INSTANCES.find(i=>i.id===id);if(!inst)return;
const lang=window._lang||'ru';
const t=k=>LANG[lang][k]||LANG.ru[k]||k;
if(pendingStops.has(id)||inst.stopping)return;
if(!!ACTIVE[id]||(_is[id]&&_is[id].pending)){
try{
const card=document.querySelector(`.instance-card[data-inst="${id}"]`);

document.getElementById('chatOutput').scrollTop=document.getElementById('chatOutput').scrollHeight;}
}catch(e){toast(e.message,true);}
return;}
if(pendingCardSaves.has(id))await pendingCardSaves.get(id);
const card=document.querySelector(`.instance-card[data-inst="${id}"]`);
if(!card)return;
const ms=card.querySelector('.inst-model'),model=ms?ms.value:inst.model;
if(!model){toast('Select model first',true);return;}
const ngl=Number(card.querySelector('.inst-ngl')?.value ?? 99);
const ctx=Number(card.querySelector('.inst-ctx')?.value ?? 16384);
const parallel=parseInt(card.querySelector('.inst-parallel')?.value)||1;
const flash=card.querySelector('input[type="checkbox"][data-param="flash"]')?.checked||false;
const ram=card.querySelector('input[type="checkbox"][data-param="ram"]')?.checked||false;
const kvq=(card.querySelector('.inst-kv')?.value||'Q8_0').toLowerCase();
// Show chat + loading progress
window.scrollTo({top:0,behavior:'smooth'});
const chatCard=document.getElementById('chatCard');
if(!chatCard.classList.contains('expanded'))chatCard.classList.add('expanded');
const output=document.getElementById('chatOutput');
const modelName=model.replace(/^.*[/\\]/,'');
const instName=escapeHtml(inst.name||id);
// Switch chat select to this instance
selectChatInstance(id);
_chatHistory=[];
output.innerHTML='';
output.innerHTML+='<div style="color:var(--text-yellow)">> '+t('instanceStart')+' <b>'+instName+'</b></div>';
output.innerHTML+='<div style="color:var(--text-yellow)">> '+t('loading')+' <b>'+escapeHtml(modelName)+'</b></div>';
output.scrollTop=output.scrollHeight;
// Check GPU availability (embed/rerank are small and share the GPU with an LLM — no conflict)
const gpuIndices=(inst.gpu_indices||[]).filter(i=>i!=='__select__');
const isChatInst=(inst.mode||'chat')==='chat';
let busyGpus=[];
if(isChatInst)INSTANCES.forEach(other=>{if(other.id===id||!ACTIVE[other.id])return;if((other.mode||'chat')!=='chat')return;
(other.gpu_indices||[]).filter(i=>i!=='__select__').forEach(gi=>{
if(gpuIndices.includes(gi)&&!busyGpus.includes(gi))busyGpus.push(gi);});});
if(busyGpus.length){
if(BUTLER_MODE==='ON'){
// Butler ON: stop conflicting chat instances, then continue loading (embed/rerank stay)
let busyNames=[];
for(const other of INSTANCES){
if(other.id===id||!ACTIVE[other.id])continue;if((other.mode||'chat')!=='chat')continue;
const matches=(other.gpu_indices||[]).filter(i=>i!=='__select__').some(gi=>gpuIndices.includes(gi));
if(matches&&!busyNames.includes(other.name))busyNames.push(other.name);}
for(const other of INSTANCES){
if(other.id===id||!ACTIVE[other.id])continue;if((other.mode||'chat')!=='chat')continue;
const matches=(other.gpu_indices||[]).filter(i=>i!=='__select__').some(gi=>gpuIndices.includes(gi));
if(matches){
output.innerHTML+='<div style="color:var(--text-yellow)">> '+t('butlerStopping')+' <b>'+escapeHtml(other.name||other.id)+'</b></div>';
output.scrollTop=output.scrollHeight;
try{await requestInstanceStop(other.id);}catch(e){}}}
await loadStatus();
} else {
output.innerHTML+='<div style="color:var(--text-danger)">> '+t('gpuBusy')+' '+escapeHtml(busyGpus.join(', '))+'</div>';
output.innerHTML+='<div style="color:var(--text-danger)">> '+t('gpuBusyDesc')+':</div>';
output.scrollTop=output.scrollHeight;
let busyNames=[];
INSTANCES.forEach(other=>{if(other.id===id||!ACTIVE[other.id])return;
const matches=(other.gpu_indices||[]).filter(i=>i!=='__select__').some(gi=>gpuIndices.includes(gi));
if(matches&&!busyNames.includes(other.name))busyNames.push(other.name);});
output.innerHTML+='<div style="color:var(--text-yellow)">'+escapeHtml(busyNames.join(', '))+'</div>';
output.scrollTop=output.scrollHeight;
return;
}}
setInstIntent(id,'up');
try{
const r=await apiPost('/api/load',{instance:id,model,ctx_size:ctx,ngl,flash_attn:flash,ram_kv:ram,kvq,parallel});
if(!r||!r.success){
_is[id]&&(_is[id].pending=false);
output.innerHTML+='<div style="color:var(--text-danger)">'+t('loadError')+': '+escapeHtml(r&&r.message||'')+'</div>';
output.scrollTop=output.scrollHeight;return;}
// Poll readiness
const progressDiv=document.createElement('div');
progressDiv.style.cssText='color:var(--text-yellow);white-space:pre-wrap';
progressDiv.textContent=t('loadingModel')+'... '+t('pleaseWait');
output.appendChild(progressDiv);output.scrollTop=output.scrollHeight;
const spinner = ['|','/','-','\\'];
let si=0;
const spinnerTimer=setInterval(()=>{si=(si+1)%4;progressDiv.textContent=t('loadingModel')+' '+spinner[si]+' '+t('pleaseWait');},200);
const pollStart=Date.now();
const poll=setInterval(async()=>{
try{
const chk=await(await fetch('/api/check/'+id)).json();
if(chk.ready){
clearInterval(poll);
clearInterval(spinnerTimer);
progressDiv.innerHTML=t('instanceStart')+' <b>'+instName+'</b>. '+t('modelLoaded')+': <b>'+escapeHtml(modelName)+'</b>';
progressDiv.style.color='var(--text-green)';
output.scrollTop=output.scrollHeight;
await loadStatus();
// Switch chat select to this instance
document.getElementById('chatModelSelect').value=id;
// Send greeting if auto-request enabled
const autoReqCheck=document.getElementById('autoReqCheck');
if(autoReqCheck&&autoReqCheck.checked){
const greetingText=document.getElementById('autoReqText').value.trim()||t('greetingUser');
_chatHistory=[];
_chatHistory.push({role:'user',content:greetingText});
autoSendChat(lang);}
} else if(chk.status==='starting'){
_is[id]&&(_is[id].sawRunning=true);
} else if((chk.status==='exited'||chk.status==='dead')||(_is[id]&&_is[id].pending&&_is[id].sawRunning&&chk.status&&chk.status!=='starting')){
// Container crashed (exited/dead = unambiguous) or vanished after running -> FAILED, no more spinning
clearInterval(poll);
clearInterval(spinnerTimer);
_is[id].failed=true;_is[id].pending=false;_state[id]='failed';
progressDiv.innerHTML='> <b>'+instName+'</b>: '+ButlerI18n.translate('Instance is OFF: model failed to load (out of VRAM?). Reduce CTX or NGL, or add a GPU. Click to retry.');
progressDiv.style.color='var(--text-danger)';
output.scrollTop=output.scrollHeight;
await loadStatus();
} else if((Date.now()-pollStart)>600000){
clearInterval(poll);
clearInterval(spinnerTimer);
progressDiv.textContent=ButlerI18n.translate('Load timed out (10 min). Check VRAM/ctx, click to retry.');
progressDiv.style.color='var(--text-danger)';
output.scrollTop=output.scrollHeight;
}}catch(e){}},2500);
}catch(e){
output.innerHTML+='<div style="color:var(--text-danger)">'+t('containerError')+': '+escapeHtml(e.message||'')+'</div>';
output.scrollTop=output.scrollHeight;}}

async function changeGpu(id, oldGpu, select){
    const newGpu = select.value;
    const oldValue = oldGpu === '__select__' ? '' : oldGpu;
    if (!newGpu || newGpu === oldGpu) {
        select.value = oldValue;
        return;
    }
    select.disabled = true;
    try {
        const result = await apiPatch('/api/instances/' + encodeURIComponent(id) + '/gpu/' + encodeURIComponent(oldGpu), {gpu_idx:newGpu});
        if (result.success !== true) throw new Error(result.message || 'save failed');
    } catch (error) {
        select.value = oldValue;
        toast(error.message, true);
    } finally {
        select.disabled = false;
        _mutate = true;
        await loadStatus();
    }
}

let _fs={scope:'inst',inst:null,path:'',entries:[],clip:null,sel:''};

function closeFs(){document.getElementById('fsOverlay').style.display='none';}
async function fsLoad(){
let _hops=0;
while(true){
try{
const d=await apiGet('/api/fs?path='+encodeURIComponent(_fs.path));
_fs.path=d.path;_fs.entries=d.entries;_fs.sel='';
document.getElementById('fsPath').value=d.path;
const freeEl=document.getElementById('fsFree');
if(freeEl)freeEl.textContent=(d.free_gb!==undefined)?('free space: '+d.free_gb+' GB'):'';
let html='';
if(d.parent&&d.parent!==d.path)html+='<div class="fs-entry" onclick="fsUp()"><span class="fs-up">..</span></div>';
for(const e of d.entries){
const cls=e.type==='dir'?'fs-dir':'fs-file';
const sz=e.size_gb?(e.size_gb+' GB'):(e.size_mb?(e.size_mb+' MB'):'');
html+=`<div class="fs-entry ${cls}" data-name="${escapeHtml(e.name)}" onclick="fsPick(this)"><span>${escapeHtml(e.name)}</span>${sz?'<span class="fs-size">'+sz+'</span>':''}</div>`;
}
document.getElementById('fsList').innerHTML=html||'<div class="fs-empty">empty</div>';
fsStatus();
return;
}catch(e){
const up=_fs.path.replace(/[\\\/][^\\\/]*$/,'')||'/';
if(up===_fs.path||_hops>=8){toast(e.message,true);return;}
_hops++;
_fs.path=up;
toast(e.message+' — up to '+up,true);
}
}
}
function fsUp(){if(_fs.path==='/'||_fs.path==='C:\\')return;_fs.path=_fs.path.replace(/[\\\/][^\\\/]*$/,'')||'/';fsLoad();}
function fsPick(el){
const name=el.getAttribute('data-name');
const e=_fs.entries.find(x=>x.name===name);
if(e&&e.type==='dir'&&_fs.sel===name){
_fs.sel='';fsStatus();
_fs.path=fsJoin(_fs.path,name);fsLoad();return;
}
document.querySelectorAll('#fsList .fs-entry.sel').forEach(x=>x.classList.remove('sel'));
el.classList.add('sel');_fs.sel=name;fsStatus();}
function fsStatus(){
const el=document.getElementById('fsStatus');
if(_fs.clip)el.textContent=(_fs.clip.mode==='cut'?'CUT: ':'COPY: ')+_fs.clip.name;
else if(_fs.sel)el.textContent='SELECTED: '+_fs.sel;
else el.textContent='';
document.querySelectorAll('.fs-icon[data-act]').forEach(b=>{
const act=b.getAttribute('data-act');
if(act==='paste')b.disabled=!_fs.clip;
if(act==='cut'||act==='copy'||act==='rename'||act==='delete')b.disabled=!_fs.sel;
});}

async function fsRename(){
if(!_fs.sel){toast('Select a file or folder first',true);return;}
const old=_fs.sel;
const n=await dlgPrompt({title:'RENAME',text:'New name for: '+old,value:old,ok:'RENAME'});
if(n===null){toast('Renamed: cancelled',true);return;}
const nn=(String(n)||'').trim();
if(!nn){toast('Empty name',true);return;}
if(nn===old){toast('Name unchanged',true);return;}
if(nn.includes('/')){toast('Name cannot contain "/"',true);return;}
try{
const r=await apiPost('/api/fs/rename',{path:fsJoin(_fs.path,old),new_name:nn});
if(r&&r.success){toast(r.message||'Renamed');_fs.sel='';_dirModels={};fsLoad();}
else toast((r&&r.message)||'Failed',true);
}catch(e){toast(e.message,true);}}

function selectChatInstance(id){
const s=document.getElementById('chatModelSelect');
const inst=INSTANCES.find(i=>i.id===id);
if(!inst)return;
// Ensure option exists (may be OFF and filtered out)
let opt=s.querySelector('option[value="'+id+'"]');
if(!opt){
opt=document.createElement('option');opt.value=id;
const isActive=!!ACTIVE[id];

async function butlerAutoStart(id){
const inst=INSTANCES.find(i=>i.id===id);

const t=k=>LANG[lang][k]||LANG.ru[k]||k;

const otherGpus=(other.gpu_indices||[]).filter(i=>i!=='__select__');
if(otherGpus.some(gi=>busyGpus.includes(gi))){

const card=document.querySelector(`.instance-card[data-inst="${id}"]`);
if(!card)return false;

// Poll until ready

try{const chk=await(await fetch('/api/check/'+id)).json();

// Send greeting if auto-request enabled

if(typeof _chatHistory!=='undefined'){_chatHistory=[];_chatHistory.push({role:'user',content:greetingText});}
autoSendChat(lang);}
return true;}
else if(chk.status==='starting'){if(_is[id])_is[id].sawRunning=true;}
else if((chk.status==='exited'||chk.status==='dead')||(_is[id]&&_is[id].pending&&_is[id].sawRunning&&chk.status&&chk.status!=='starting')){
// container crashed (exited/dead = unambiguous) or vanished after running -> FAILED
clearInterval(spinnerTimer);
_is[id].failed=true;_is[id].pending=false;_state[id]='failed';
progressDiv.innerHTML='> <b>'+instName+'</b>: '+ButlerI18n.translate('Instance is OFF: model failed to load (out of VRAM?). Reduce CTX or NGL, or add a GPU.');
progressDiv.style.color='var(--text-danger)';

await loadStatus();
return false;}}
catch(e){progressDiv.textContent=t('loadError');}}

sb.textContent=active?'PAUSE':'START';
sb.style.backgroundColor=active?'#647864':'';
fill.classList.toggle('pausebar',s.status==='paused');
if(s.status==='downloading'){const pct=s.total?Math.min(100,s.received*100/s.total).toFixed(1):null;const prog=hfFmt(s.received)+(s.total?' / '+hfFmt(s.total):'')+(s.speed?' · '+hfFmt(s.speed)+'/s':'');st.innerHTML=(s.filename?'<span style="color:var(--text-secondary)">'+s.filename.replace(/</g,'&lt;')+'</span> - ':'')+'<span style="color:var(--text-yellow)">'+prog+'</span>';fill.style.width=(pct||0)+'%';fill.classList.remove('err');}
else if(s.status==='retrying'){st.textContent='retrying… '+(s.error||'');if(s.total)fill.style.width=Math.min(100,s.received*100/s.total).toFixed(1)+'%';fill.classList.remove('err');}
else if(s.status==='paused'){st.textContent='paused — START resumes from '+hfFmt(s.received);if(s.total)fill.style.width=Math.min(100,s.received*100/s.total).toFixed(1)+'%';fill.classList.remove('err');}
else if(s.status==='done'){st.innerHTML='<span style="color:var(--text-green)">DONE: '+(s.filename||'').replace(/</g,'&lt;')+'</span>';fill.style.width='100%';fill.classList.remove('err');if(_hfTimer){clearInterval(_hfTimer);_hfTimer=null;}

<button class="fs-icon" data-act="paste" onclick="fsPaste()" title="Paste" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg></button>

</div>
<button class="btn-apply-dir" onclick="fsApply()">APPLY DIR</button>
</div>
<div class="fs-status" id="fsStatus"></div>
</div>
</div>
<div class="fs-overlay" id="dlgOverlay" style="display:none" onclick="if(event.target===this)dlgCancel()">

<div class="dlg-text" id="dlgText"></div>
<div id="dlgInputWrap" style="display:none"><input class="fs-path" id="dlgInput" spellcheck="false" onkeydown="if(event.key==='Enter')dlgOkClick();if(event.key==='Escape')dlgCancel()"></div>
<div class="dlg-btns">
<button class="dlg-btn dlg-cancel" onclick="dlgCancel()">CANCEL</button>
<button class="dlg-btn dlg-ok" id="dlgOk" onclick="dlgOkClick()">OK</button>
</div>
</div>
</div>
